# Scoop — met à jour les vidéos du fil toutes les 30 minutes (gratuit sur un dépôt public)
name: Vidéos du fil

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: videos-du-fil
  cancel-in-progress: false

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Récupérer et trier les vidéos
        run: node scripts/update-live.mjs
      - name: Publier si la liste a changé
        run: |
          git config user.name "scoop-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
            exit 0
          fi
          git commit -m "Vidéos du fil (mise à jour automatique)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
