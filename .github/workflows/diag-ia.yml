name: Diagnostic IA (temporaire)
on:
  workflow_dispatch: {}
permissions:
  contents: read
  models: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Catalogue GitHub Models
        env:
          T: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "== catalogue =="
          curl -sS -i -m 30 https://models.github.ai/catalog/models -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" | head -c 1500
          echo; echo "== chat sans response_format =="
          curl -sS -i -m 60 https://models.github.ai/inference/chat/completions -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json" -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Réponds par le mot: ok"}]}' | head -c 1500
          echo; echo "== chat org-style =="
          curl -sS -i -m 60 https://models.github.ai/orgs/scoopfr/inference/chat/completions -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json" -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Réponds par le mot: ok"}]}' | head -c 1500
      - name: Pollinations
        run: |
          curl -sS -i -m 60 https://text.pollinations.ai/openai -H "Content-Type: application/json" -d '{"model":"openai","messages":[{"role":"user","content":"Réponds par le mot: ok"}]}' | head -c 1200
